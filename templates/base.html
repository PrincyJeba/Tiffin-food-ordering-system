<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Tiffin{% endblock %} — Food Ordering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
    <a class="wordmark" href="{{ url_for('home') }}">
        <span class="wordmark-mark">🍲</span>
        <span class="wordmark-text">Tiffin</span>
    </a>
    <p class="tagline">order from the everyday menu</p>
    <a class="cart-link" href="{{ url_for('cart') }}">
        Cart
        {% if cart_count is defined and cart_count %}<span class="cart-badge">{{ cart_count }}</span>{% endif %}
    </a>
</header>

<main class="page">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <span>Tiffin Food Ordering — v{{ version }}</span>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
