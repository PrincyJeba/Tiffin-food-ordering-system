{% extends "base.html" %}
{% block title %}Order confirmed{% endblock %}
{% block content %}

<section class="success-page">
    <span class="success-emoji" aria-hidden="true">✅</span>
    <h1>Order placed successfully!</h1>
    <p class="order-id">Order ID: <strong>{{ order_id }}</strong></p>
    <p class="success-note">We've received your order and it's being prepared.</p>
    <a class="btn-primary" href="{{ url_for('home') }}">Order more food</a>
</section>

{% endblock %}
